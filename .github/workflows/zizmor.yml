name: zizmor (GitHub Actions audit)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run zizmor
        # Pinned to a full commit SHA per zizmor's own quickstart; the trailing
        # comment tracks the human-readable version. Action lives at
        # github.com/zizmorcore/zizmor-action (not `zizmors`, which 404s).
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          # SARIF results land in Security → Code scanning, same place as CodeQL.
          advanced-security: true
